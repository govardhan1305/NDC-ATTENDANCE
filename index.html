<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NDC Attendance System</title>

<style>
:root{
    --blue:#0b3d91;
    --blue-dark:#06265f;
    --blue-light:#eaf2ff;
    --bg:#f3f6fb;
    --white:#ffffff;
    --text:#162033;
    --muted:#718096;
    --green:#13865c;
    --red:#d74444;
    --orange:#d28b18;
    --border:#e2e8f0;
    --shadow:0 12px 35px rgba(15,35,70,.10);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
    opacity:.55;
}

/* =========================
   LOGIN
========================= */

.login-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    background:
        radial-gradient(circle at 10% 10%,rgba(11,61,145,.15),transparent 30%),
        radial-gradient(circle at 90% 90%,rgba(11,61,145,.12),transparent 30%),
        linear-gradient(135deg,#eef4ff,#f8fafc);
}

.login-card{
    width:100%;
    max-width:460px;
    background:rgba(255,255,255,.96);
    border:1px solid rgba(255,255,255,.8);
    border-radius:28px;
    padding:34px;
    box-shadow:
        0 25px 70px rgba(6,38,95,.15),
        inset 0 1px 0 rgba(255,255,255,.8);
}

.brand{
    text-align:center;
    margin-bottom:30px;
}

.brand-logo{
    width:76px;
    height:76px;
    margin:auto;
    border-radius:22px;
    background:linear-gradient(145deg,var(--blue),var(--blue-dark));
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:27px;
    font-weight:900;
    letter-spacing:-1px;
    box-shadow:
        0 15px 30px rgba(11,61,145,.28),
        inset 0 2px 3px rgba(255,255,255,.25);
}

.brand h1{
    margin-top:18px;
    font-size:27px;
}

.brand p{
    color:var(--muted);
    margin-top:7px;
    font-size:14px;
}

.role-switch{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    background:#f1f5f9;
    padding:6px;
    border-radius:15px;
    margin-bottom:22px;
}

.role-switch button{
    border:0;
    background:transparent;
    padding:11px 5px;
    border-radius:11px;
    color:var(--muted);
    font-weight:700;
}

.role-switch button.active{
    background:white;
    color:var(--blue);
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.form-group input,
.form-group select{
    width:100%;
    padding:14px 15px;
    border:1px solid var(--border);
    border-radius:13px;
    outline:none;
    background:#fff;
    transition:.2s;
}

.form-group input:focus,
.form-group select:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 4px rgba(11,61,145,.09);
}

.primary-btn{
    width:100%;
    border:0;
    padding:14px;
    border-radius:13px;
    color:white;
    background:linear-gradient(145deg,var(--blue),var(--blue-dark));
    font-weight:800;
    box-shadow:0 9px 20px rgba(11,61,145,.23);
    transition:.2s;
}

.primary-btn:hover{
    transform:translateY(-1px);
}

.secondary-btn{
    border:1px solid var(--border);
    background:white;
    color:var(--blue);
    padding:12px 16px;
    border-radius:12px;
    font-weight:700;
}

.demo-note{
    text-align:center;
    margin-top:17px;
    color:var(--muted);
    font-size:12px;
}

/* =========================
   APP
========================= */

.app-shell{
    min-height:100vh;
}

.topbar{
    height:72px;
    background:white;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:sticky;
    top:0;
    z-index:20;
}

.top-brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.top-logo{
    width:43px;
    height:43px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,var(--blue),var(--blue-dark));
    color:white;
    font-weight:900;
    font-size:15px;
    box-shadow:0 7px 15px rgba(11,61,145,.2);
}

.top-brand strong{
    display:block;
}

.top-brand small{
    color:var(--muted);
}

.profile-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--blue-light);
    color:var(--blue);
    font-weight:800;
}

.logout-btn{
    border:0;
    background:transparent;
    color:var(--red);
    font-weight:700;
}

.page{
    max-width:1200px;
    margin:auto;
    padding:28px 22px 50px;
}

.page-title{
    margin-bottom:24px;
}

.page-title h2{
    font-size:29px;
}

.page-title p{
    color:var(--muted);
    margin-top:5px;
}

/* =========================
   CARDS
========================= */

.grid{
    display:grid;
    gap:18px;
}

.stats-grid{
    grid-template-columns:repeat(4,1fr);
}

.dashboard-grid{
    grid-template-columns:2fr 1fr;
}

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    box-shadow:var(--shadow);
}

.stat-card{
    position:relative;
    overflow:hidden;
}

.stat-card:after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    background:var(--blue-light);
    right:-35px;
    top:-35px;
}

.stat-label{
    color:var(--muted);
    font-size:13px;
    font-weight:700;
}

.stat-value{
    font-size:29px;
    font-weight:900;
    margin-top:9px;
}

.stat-extra{
    margin-top:6px;
    font-size:12px;
    color:var(--green);
    font-weight:700;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.section-title h3{
    font-size:17px;
}

/* =========================
   LOCATION
========================= */

.zone-card{
    position:relative;
    overflow:hidden;
}

.zone-status{
    display:flex;
    align-items:center;
    gap:13px;
}

.zone-dot{
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--orange);
    box-shadow:0 0 0 7px rgba(210,139,24,.12);
}

.zone-dot.inside{
    background:var(--green);
    box-shadow:0 0 0 7px rgba(19,134,92,.12);
}

.zone-dot.outside{
    background:var(--red);
    box-shadow:0 0 0 7px rgba(215,68,68,.12);
}

.zone-main{
    font-weight:800;
}

.zone-sub{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.location-details{
    margin-top:18px;
    padding-top:15px;
    border-top:1px solid var(--border);
    font-size:12px;
    color:var(--muted);
    line-height:1.8;
}

/* =========================
   CLASSES
========================= */

.class-list{
    display:flex;
    flex-direction:column;
    gap:11px;
}

.class-item{
    border:1px solid var(--border);
    border-radius:15px;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.class-info strong{
    display:block;
}

.class-info span{
    color:var(--muted);
    font-size:12px;
}

.status-pill{
    padding:6px 10px;
    border-radius:999px;
    font-size:11px;
    font-weight:800;
}

.present{
    color:var(--green);
    background:#e8f7f0;
}

.absent{
    color:var(--red);
    background:#fdecec;
}

.pending{
    color:#9a6900;
    background:#fff4d7;
}

/* =========================
   SCANNER
========================= */

.scanner-box{
    text-align:center;
    padding:30px 20px;
}

.scanner-frame{
    width:230px;
    height:230px;
    margin:20px auto;
    border:5px solid var(--blue);
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background:
        repeating-linear-gradient(
            0deg,
            #fff,
            #fff 7px,
            #edf3ff 8px
        );
    box-shadow:
        0 20px 45px rgba(11,61,145,.16),
        inset 0 0 25px rgba(11,61,145,.06);
}

.scan-line{
    position:absolute;
    left:10px;
    right:10px;
    height:3px;
    background:var(--blue);
    box-shadow:0 0 12px rgba(11,61,145,.6);
    animation:scan 1.7s infinite;
}

@keyframes scan{
    0%{top:15px}
    50%{top:205px}
    100%{top:15px}
}

.fake-qr{
    width:150px;
    height:150px;
    background:
        linear-gradient(90deg,#111 10px,transparent 10px) 0 0/30px 30px,
        linear-gradient(#111 10px,transparent 10px) 0 0/30px 30px,
        #fff;
    opacity:.75;
}

/* =========================
   TEACHER QR
========================= */

.qr-session{
    max-width:520px;
    margin:30px auto;
    text-align:center;
}

.qr-display{
    width:290px;
    height:290px;
    margin:25px auto;
    background:white;
    border:12px solid white;
    border-radius:16px;
    box-shadow:0 20px 45px rgba(0,0,0,.13);
    display:flex;
    align-items:center;
    justify-content:center;
}

.qr-pattern{
    width:100%;
    height:100%;
    background:
        linear-gradient(90deg,#111 12px,transparent 12px) 0 0/36px 36px,
        linear-gradient(#111 12px,transparent 12px) 0 0/36px 36px,
        linear-gradient(45deg,transparent 35%,#111 35%,#111 65%,transparent 65%);
}

.timer{
    font-size:30px;
    font-weight:900;
    color:var(--blue);
}

.session-note{
    color:var(--muted);
    font-size:13px;
    margin-top:8px;
}

/* =========================
   ADMIN
========================= */

.admin-actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.action-card{
    padding:20px;
    border:1px solid var(--border);
    border-radius:17px;
    background:white;
    cursor:pointer;
    transition:.2s;
}

.action-card:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow);
}

.action-icon{
    width:45px;
    height:45px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--blue-light);
    color:var(--blue);
    font-weight:900;
    margin-bottom:14px;
}

.action-card strong{
    display:block;
}

.action-card span{
    color:var(--muted);
    font-size:12px;
}

/* =========================
   MODAL
========================= */

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(5,20,45,.52);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:100;
}

.modal{
    width:100%;
    max-width:480px;
    background:white;
    border-radius:22px;
    padding:25px;
    box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close-btn{
    border:0;
    background:#f1f5f9;
    width:34px;
    height:34px;
    border-radius:10px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    max-width:350px;
    background:#14213d;
    color:white;
    padding:14px 17px;
    border-radius:13px;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
    transform:translateY(120px);
    opacity:0;
    transition:.3s;
    z-index:200;
    font-size:13px;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

.toast.success{
    background:var(--green);
}

.toast.error{
    background:var(--red);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){
    .stats-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .dashboard-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:650px){
    .topbar{
        padding:0 15px;
    }

    .top-brand small{
        display:none;
    }

    .page{
        padding:22px 15px 40px;
    }

    .page-title h2{
        font-size:24px;
    }

    .stats-grid{
        grid-template-columns:1fr 1fr;
    }

    .admin-actions{
        grid-template-columns:1fr;
    }

    .login-card{
        padding:25px 20px;
    }

    .qr-display{
        width:250px;
        height:250px;
    }
}

@media(max-width:430px){
    .stats-grid{
        grid-template-columns:1fr;
    }

    .profile-area .logout-btn{
        font-size:12px;
    }
}
</style>
</head>

<body>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script>

/* =========================================================
   NDC COLLEGE LOCATION
   ========================================================= */

const NDC_LOCATION = {
    latitude: 13.116383,
    longitude: 77.562075
};

/*
   Attendance zone radius.
   Students within this distance from the college coordinates
   are considered inside the attendance zone.
*/
const NDC_RADIUS_METERS = 200;


/* =========================================================
   APP STATE
   ========================================================= */

let currentRole = "student";
let currentUser = null;

let locationInside = false;
let currentDistance = null;
let currentAccuracy = null;

let countdownInterval = null;
let attendanceTime = 300;


/* =========================================================
   SAMPLE DATA
   ========================================================= */

const studentData = {
    name: "Student User",
    id: "NDC2026001",
    department: "B.Sc Computer Science",
    semester: "Semester 3",
    attendance: "92%",
    present: 46,
    total: 50
};

const classes = [
    {
        subject:"Web Technology",
        teacher:"Dr. Ravi Kumar",
        time:"09:30 AM",
        room:"Room 201",
        status:"Present"
    },
    {
        subject:"Database Management",
        teacher:"Prof. Anitha",
        time:"11:00 AM",
        room:"Room 204",
        status:"Present"
    },
    {
        subject:"Computer Networks",
        teacher:"Prof. Suresh",
        time:"02:00 PM",
        room:"Room 301",
        status:"Pending"
    }
];


/* =========================================================
   UTILITY
   ========================================================= */

function escapeHTML(value){
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   LOGIN
   ========================================================= */

function renderLogin(){

    document.getElementById("app").innerHTML = `
        <div class="login-page">

            <div class="login-card">

                <div class="brand">

                    <div class="brand-logo">
                        NDC
                    </div>

                    <h1>NDC Attendance</h1>

                    <p>
                        Nagarjuna Degree College
                    </p>

                </div>


                <div class="role-switch">

                    <button
                        id="roleStudent"
                        class="${currentRole === "student" ? "active" : ""}"
                        onclick="setRole('student')">
                        Student
                    </button>

                    <button
                        id="roleTeacher"
                        class="${currentRole === "teacher" ? "active" : ""}"
                        onclick="setRole('teacher')">
                        Teacher
                    </button>

                    <button
                        id="roleAdmin"
                        class="${currentRole === "admin" ? "active" : ""}"
                        onclick="setRole('admin')">
                        Admin
                    </button>

                </div>


                <div class="form-group">

                    <label>
                        ${currentRole === "student"
                            ? "Student ID"
                            : currentRole === "teacher"
                            ? "Teacher ID"
                            : "Admin ID"}
                    </label>

                    <input
                        id="loginId"
                        placeholder="Enter your ID"
                    >

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="Enter password"
                    >

                </div>


                <button
                    class="primary-btn"
                    onclick="login()">
                    Login
                </button>


                <div class="demo-note">
                    Demo login: enter any ID and password
                </div>

            </div>

        </div>
    `;
}


function setRole(role){

    currentRole = role;

    renderLogin();
}


function login(){

    const id =
        document.getElementById("loginId").value.trim();

    const password =
        document.getElementById("loginPassword").value.trim();

    if(!id || !password){

        showToast(
            "Please enter ID and password.",
            "error"
        );

        return;
    }

    currentUser = {
        id:id,
        name:
            currentRole === "student"
            ? "Student User"
            : currentRole === "teacher"
            ? "Teacher User"
            : "Administrator"
    };

    if(currentRole === "student"){
        renderStudent();
    }
    else if(currentRole === "teacher"){
        renderTeacher();
    }
    else{
        renderAdmin();
    }
}


/* =========================================================
   TOP BAR
   ========================================================= */

function topbar(){

    return `

        <div class="topbar">

            <div class="top-brand">

                <div class="top-logo">
                    NDC
                </div>

                <div>
                    <strong>NDC Attendance</strong>
                    <small> Nagarjuna Degree College</small>
                </div>

            </div>


            <div class="profile-area">

                <div class="avatar">
                    ${currentUser
                        ? escapeHTML(currentUser.name.charAt(0).toUpperCase())
                        : "U"}
                </div>

                <button
                    class="logout-btn"
                    onclick="logout()">
                    Logout
                </button>

            </div>

        </div>
    `;
}


function logout(){

    currentUser = null;
    locationInside = false;
    currentDistance = null;

    if(countdownInterval){
        clearInterval(countdownInterval);
    }

    renderLogin();
}


/* =========================================================
   STUDENT DASHBOARD
   ========================================================= */

function renderStudent(){

    document.getElementById("app").innerHTML = `

        <div class="app-shell">

            ${topbar()}

            <main class="page">

                <div class="page-title">

                    <h2>
                        Welcome, ${escapeHTML(studentData.name)}
                    </h2>

                    <p>
                        Student attendance dashboard
                    </p>

                </div>


                <div class="grid stats-grid">

                    <div class="card stat-card">

                        <div class="stat-label">
                            Attendance
                        </div>

                        <div class="stat-value">
                            ${studentData.attendance}
                        </div>

                        <div class="stat-extra">
                            Good attendance
                        </div>

                    </div>


                    <div class="card stat-card">

                        <div class="stat-label">
                            Present
                        </div>

                        <div class="stat-value">
                            ${studentData.present}
                        </div>

                        <div class="stat-extra">
                            Classes attended
                        </div>

                    </div>


                    <div class="card stat-card">

                        <div class="stat-label">
                            Total Classes
                        </div>

                        <div class="stat-value">
                            ${studentData.total}
                        </div>

                        <div class="stat-extra">
                            Recorded classes
                        </div>

                    </div>


                    <div class="card stat-card">

                        <div class="stat-label">
                            Student ID
                        </div>

                        <div class="stat-value"
                             style="font-size:21px">
                            ${studentData.id}
                        </div>

                        <div class="stat-extra">
                            Active account
                        </div>

                    </div>

                </div>


                <br>


                <div class="grid dashboard-grid">

                    <div class="card">

                        <div class="section-title">

                            <h3>
                                Today's Classes
                            </h3>

                        </div>

                        <div class="class-list">

                            ${classes.map(classItem).join("")}

                        </div>

                    </div>


                    <div class="card zone-card">

                        <div class="section-title">

                            <h3>
                                Attendance Zone
                            </h3>

                            <button
                                class="secondary-btn"
                                onclick="checkAttendanceZone()">
                                Refresh
                            </button>

                        </div>


                        <div class="zone-status">

                            <div
                                id="zoneDot"
                                class="zone-dot">
                            </div>

                            <div>

                                <div
                                    id="zoneMain"
                                    class="zone-main">
                                    Checking location...
                                </div>

                                <div
                                    id="zoneSub"
                                    class="zone-sub">
                                    Please allow GPS access.
                                </div>

                            </div>

                        </div>


                        <div class="location-details">

                            <strong>
                                College Attendance Zone
                            </strong>

                            <br>

                            Latitude:
                            ${NDC_LOCATION.latitude}

                            <br>

                            Longitude:
                            ${NDC_LOCATION.longitude}

                            <br>

                            Radius:
                            ${NDC_RADIUS_METERS} meters

                        </div>


                        <br>


                        <button
                            id="scannerButton"
                            class="primary-btn"
                            onclick="openScanner()"
                            disabled>

                            Checking location...

                        </button>

                    </div>

                </div>

            </main>

        </div>
    `;

    checkAttendanceZone();
}


/* =========================================================
   CLASS ITEM
   ========================================================= */

function classItem(item){

    const statusClass =
        item.status === "Present"
        ? "present"
        : item.status === "Absent"
        ? "absent"
        : "pending";

    return `

        <div class="class-item">

            <div class="class-info">

                <strong>

/* =========================================================
   GEOLOCATION
   ========================================================= */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const earthRadius = 6371000;

    const toRadians =
        degrees => degrees * Math.PI / 180;

    const dLat =
        toRadians(lat2 - lat1);

    const dLon =
        toRadians(lon2 - lon1);

    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRadians(lat1)) *
        Math.cos(toRadians(lat2)) *
        Math.sin(dLon / 2) ** 2;

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return earthRadius * c;
}


/* =========================================================
   CHECK ATTENDANCE ZONE
   ========================================================= */

function checkAttendanceZone(){

    const zoneMain =
        document.getElementById("zoneMain");

    const zoneSub =
        document.getElementById("zoneSub");

    const scannerButton =
        document.getElementById("scannerButton");

    const zoneDot =
        document.getElementById("zoneDot");

    if(!zoneMain || !scannerButton){
        return;
    }


    zoneMain.textContent =
        "Checking location...";

    zoneSub.textContent =
        "Please allow location access.";

    scannerButton.disabled = true;

    scannerButton.textContent =
        "Checking location...";

    zoneDot.className =
        "zone-dot";


    if(!navigator.geolocation){

        zoneMain.textContent =
            "GPS not supported";

        zoneSub.textContent =
            "Your browser does not support location services.";

        setOutsideZone();

        return;
    }


    navigator.geolocation.getCurrentPosition(

        function(position){

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;

            const distance =
                calculateDistance(
                    latitude,
                    longitude,
                    NDC_LOCATION.latitude,
                    NDC_LOCATION.longitude
                );


            currentDistance = distance;
            currentAccuracy = accuracy;


            if(distance <= NDC_RADIUS_METERS){

                setInsideZone(
                    distance,
                    accuracy
                );

            }
            else{

                setOutsideZone(
                    distance
                );

            }

        },

        function(error){

            locationInside = false;

            zoneMain.textContent =
                "Location unavailable";

            scannerButton.disabled = true;

            scannerButton.textContent =
                "Location Required";

            zoneDot.className =
                "zone-dot outside";


            if(error.code === 1){

                zoneSub.textContent =
                    "Location permission denied. Please allow GPS access.";

            }
            else{

                zoneSub.textContent =
                    "Unable to get your current location. Try again.";

            }

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }
    );
}

/* =========================================================
   GENERATE QR
   ========================================================= */

function generateQR(){

    const qr =
        document.getElementById("qrPattern");

    if(!qr){
        return;
    }


    const random =
        Math.random()
        .toString(36)
        .substring(2,10);


    qr.style.background = `
        repeating-linear-gradient(
            90deg,
            #111 0px,
            #111 ${5 + Math.random()*10}px,
            transparent ${10 + Math.random()*10}px,
            transparent ${15 + Math.random()*10}px
        ),
        repeating-linear-gradient(
            0deg,
            #111 0px,
            #111 ${5 + Math.random()*10}px,
            transparent ${10 + Math.random()*10}px,
            transparent ${15 + Math.random()*10}px
        ),
        #fff
    `;

    qr.dataset.token = random;

    showToast(
        "New QR token generated.",
        "success"
    );
}


/* =========================================================
   COUNTDOWN
   ========================================================= */

function startCountdown(){

    if(countdownInterval){
        clearInterval(countdownInterval);
    }


    countdownInterval =
        setInterval(function(){

            attendanceTime--;

            const timer =
                document.getElementById("timer");

            if(!timer){
                clearInterval(countdownInterval);
                return;
            }


            const minutes =
                Math.floor(attendanceTime / 60);

            const seconds =
                attendanceTime % 60;


            timer.textContent =
                `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;


            if(attendanceTime <= 0){

                clearInterval(countdownInterval);

                showToast(
                    "Attendance session expired.",
                    "error"
                );

                renderTeacher();
            }

        },1000);
}


/* =========================================================
   END ATTENDANCE
   ========================================================= */

function endAttendance(){

    if(countdownInterval){
        clearInterval(countdownInterval);
    }

    showToast(
        "Attendance session ended.",
        "success"
    );

    renderTeacher();
}
