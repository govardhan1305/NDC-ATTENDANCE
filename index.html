<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NDC Attendance System</title>

<style>
/* =========================================================
   NDC ATTENDANCE SYSTEM
   SINGLE-FILE FRONTEND
   ========================================================= */

:root {
    --blue: #0b3d91;
    --blue-dark: #06265f;
    --blue-light: #eaf2ff;
    --blue-mid: #1760c5;

    --white: #ffffff;
    --bg: #f3f6fb;

    --text: #162033;
    --muted: #718096;

    --green: #13865c;
    --red: #d74444;
    --orange: #d28b18;

    --shadow:
        0 20px 55px rgba(13, 45, 91, .12),
        0 5px 15px rgba(13, 45, 91, .06);

    --shadow-hover:
        0 28px 70px rgba(13, 45, 91, .18),
        0 8px 22px rgba(13, 45, 91, .08);

    --radius: 22px;
}

/* ---------------- RESET ---------------- */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family:
        Inter,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(23,96,197,.10),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 10%,
            rgba(11,61,145,.08),
            transparent 30%
        ),
        var(--bg);
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

/* ---------------- APP ---------------- */

#app {
    min-height: 100vh;
}

/* ---------------- LOGIN ---------------- */

.login-screen {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px;

    position: relative;
    overflow: hidden;
}

.login-screen::before {
    content: "";

    position: absolute;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(11,61,145,.14),
            transparent 70%
        );

    top: -180px;
    left: -180px;
}

.login-screen::after {
    content: "";

    position: absolute;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(23,96,197,.10),
            transparent 70%
        );

    right: -200px;
    bottom: -200px;
}

.login-card {
    position: relative;
    z-index: 2;

    width: 430px;
    max-width: 100%;

    padding: 40px;

    border-radius: 30px;

    background:
        rgba(255,255,255,.91);

    backdrop-filter: blur(20px);

    border:
        1px solid rgba(255,255,255,.9);

    box-shadow:
        0 35px 90px rgba(13,45,91,.18),
        0 10px 25px rgba(13,45,91,.07);
}

.logo-box {
    width: 85px;
    height: 85px;

    margin: 0 auto 18px;

    border-radius: 24px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    font-size: 27px;
    font-weight: 900;

    background:
        linear-gradient(
            145deg,
            #1760c5,
            #06265f
        );

    box-shadow:
        0 18px 35px rgba(11,61,145,.28),
        inset 0 2px 2px rgba(255,255,255,.3);

    transform:
        perspective(600px)
        rotateX(3deg);
}

.login-title {
    text-align: center;
}

.login-title h1 {
    font-size: 28px;
    letter-spacing: -1px;
}

.login-title p {
    margin-top: 7px;
    color: var(--muted);
    font-size: 14px;
}

/* ---------------- ROLE SWITCH ---------------- */

.role-switch {
    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: 6px;

    padding: 5px;

    margin: 28px 0 22px;

    background: #edf2f9;

    border-radius: 14px;
}

.role-btn {
    border: 0;

    padding: 11px 5px;

    border-radius: 10px;

    background: transparent;

    color: var(--muted);

    font-size: 13px;
    font-weight: 700;
}

.role-btn.active {
    color: var(--blue);

    background: white;

    box-shadow:
        0 4px 12px rgba(13,45,91,.09);
}

/* ---------------- FORM ---------------- */

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;

    margin-bottom: 7px;

    font-size: 13px;

    font-weight: 700;

    color: #475569;
}

.form-input {
    width: 100%;

    height: 50px;

    padding: 0 15px;

    border-radius: 13px;

    border: 1px solid #dbe3ef;

    outline: none;

    background: rgba(255,255,255,.9);

    transition: .2s;
}

.form-input:focus {
    border-color: var(--blue);

    box-shadow:
        0 0 0 4px rgba(11,61,145,.09);
}

.primary-btn {
    width: 100%;

    min-height: 50px;

    border: 0;

    border-radius: 14px;

    color: white;

    font-weight: 800;

    background:
        linear-gradient(
            145deg,
            #1760c5,
            #0b3d91
        );

    box-shadow:
        0 10px 25px rgba(11,61,145,.23),
        inset 0 1px 0 rgba(255,255,255,.28);

    transition: .2s;
}

.primary-btn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 16px 30px rgba(11,61,145,.28);
}

.secondary-btn {
    min-height: 46px;

    padding: 0 18px;

    border-radius: 12px;

    border: 1px solid #dbe3ef;

    color: var(--blue);

    background: white;

    font-weight: 750;
}

.danger-btn {
    min-height: 46px;

    padding: 0 18px;

    border-radius: 12px;

    border: 0;

    color: white;

    background: var(--red);

    font-weight: 750;
}

/* ---------------- APP LAYOUT ---------------- */

.app-layout {
    min-height: 100vh;
}

.topbar {
    height: 74px;

    position: sticky;
    top: 0;
    z-index: 100;

    display: flex;
    align-items: center;

    background:
        rgba(255,255,255,.88);

    backdrop-filter: blur(18px);

    border-bottom:
        1px solid rgba(11,61,145,.08);

    box-shadow:
        0 5px 20px rgba(13,45,91,.05);
}

.topbar-inner {
    width: min(1180px, calc(100% - 28px));

    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-icon {
    width: 43px;
    height: 43px;

    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    font-weight: 900;

    background:
        linear-gradient(
            145deg,
            #1760c5,
            #06265f
        );

    box-shadow:
        0 8px 18px rgba(11,61,145,.2);
}

.brand-text strong {
    display: block;

    color: var(--blue);

    font-size: 16px;
}

.brand-text span {
    display: block;

    color: var(--muted);

    font-size: 11px;
    margin-top: 2px;
}

.user-menu {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 42px;
    height: 42px;

    border-radius: 13px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    font-weight: 800;

    background:
        linear-gradient(
            145deg,
            #1760c5,
            #0b3d91
        );

    box-shadow:
        0 8px 20px rgba(11,61,145,.18);
}

/* ---------------- MAIN ---------------- */

.main {
    width: min(1180px, calc(100% - 28px));

    margin: auto;

    padding: 30px 0 70px;
}

.page-heading {
    margin-bottom: 24px;
}

.page-heading h1 {
    font-size: clamp(26px, 4vw, 38px);

    letter-spacing: -1.5px;
}

.page-heading p {
    margin-top: 6px;

    color: var(--muted);
}

/* ---------------- GRID ---------------- */

.stats-grid {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 17px;

    margin-bottom: 20px;
}

.content-grid {
    display: grid;

    grid-template-columns:
        1.3fr .7fr;

    gap: 20px;
}

/* ---------------- CARD ---------------- */

.card {
    position: relative;

    padding: 24px;

    border-radius: var(--radius);

    background:
        rgba(255,255,255,.87);

    backdrop-filter: blur(14px);

    border:
        1px solid rgba(255,255,255,.9);

    box-shadow: var(--shadow);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.card:hover {
    transform: translateY(-4px);

    box-shadow: var(--shadow-hover);
}

/* ---------------- STAT ---------------- */

.stat-card {
    overflow: hidden;
}

.stat-card::before {
    content: "";

    position: absolute;

    width: 130px;
    height: 130px;

    border-radius: 50%;

    right: -60px;
    top: -60px;

    background:
        radial-gradient(
            circle,
            rgba(11,61,145,.13),
            transparent 70%
        );
}

.stat-icon {
    width: 42px;
    height: 42px;

    border-radius: 13px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--blue-light);

    color: var(--blue);

    font-size: 19px;

    margin-bottom: 16px;
}

.stat-value {
    font-size: 31px;

    font-weight: 900;

    letter-spacing: -1.5px;

    color: var(--blue);
}

.stat-label {
    margin-top: 5px;

    color: var(--muted);

    font-size: 13px;

    font-weight: 650;
}

/* ---------------- ZONE ---------------- */

.zone-card {
    min-height: 285px;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f2f7ff
        );
}

.zone-card::after {
    content: "";

    position: absolute;

    width: 230px;
    height: 230px;

    right: -90px;
    bottom: -100px;

    border-radius: 50%;

    border:
        1px solid rgba(11,61,145,.08);
}

.zone-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 10px;

    margin-bottom: 25px;
}

.zone-title h2 {
    font-size: 20px;
}

.zone-title p {
    color: var(--muted);

    margin-top: 5px;

    font-size: 13px;
}

.zone-status {
    display: inline-flex;

    align-items: center;

    gap: 8px;

    padding: 8px 12px;

    border-radius: 999px;

    font-size: 12px;

    font-weight: 800;
}

.zone-status.inside {
    color: var(--green);

    background:
        rgba(19,134,92,.10);
}

.zone-status.outside {
    color: var(--red);

    background:
        rgba(215,68,68,.10);
}

.zone-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: currentColor;

    box-shadow:
        0 0 0 5px rgba(19,134,92,.09);
}

.zone-visual {
    height: 115px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 10px 0 22px;

    border-radius: 18px;

    overflow: hidden;

    background:
        radial-gradient(
            circle,
            rgba(23,96,197,.11),
            transparent 65%
        ),
        #edf4ff;
}

.zone-circle {
    width: 105px;
    height: 105px;

    border-radius: 50%;

    border:
        2px solid rgba(11,61,145,.25);

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;
}

.zone-circle::before,
.zone-circle::after {
    content: "";

    position: absolute;

    border-radius: 50%;

    border:
        1px solid rgba(11,61,145,.12);
}

.zone-circle::before {
    inset: -18px;
}

.zone-circle::after {
    inset: -38px;
}

.zone-pin {
    width: 37px;
    height: 37px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    background:
        linear-gradient(
            145deg,
            #1760c5,
            #0b3d91
        );

    box-shadow:
        0 10px 22px rgba(11,61,145,.25);
}

/* ---------------- SCANNER ---------------- */

.scanner-page {
    display: none;
}

.scanner-box {
    width: min(430px, 100%);

    margin: 30px auto;

    padding: 24px;

    border-radius: 28px;

    background:
        #ffffff;

    box-shadow:
        0 30px 70px rgba(13,45,91,.15);
}

.camera {
    width: 100%;

    aspect-ratio: 1;

    position: relative;

    overflow: hidden;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            #06182f,
            #12365f
        );

    box-shadow:
        inset 0 0 50px rgba(0,0,0,.3);
}

.camera::before {
    content: "";

    position: absolute;

    inset: 35px;

    border:
        2px solid rgba(255,255,255,.9);

    border-radius: 18px;
}

.camera::after {
    content: "";

    position: absolute;

    left: 10%;
    right: 10%;

    top: 50%;

    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #66aaff,
            transparent
        );

    box-shadow:
        0 0 16px #66aaff;

    animation:
        scan 2s infinite ease-in-out;
}

@keyframes scan {
    0% {
        transform: translateY(-110px);
    }

    50% {
        opacity: 1;
    }

    100% {
        transform: translateY(110px);
    }
}

.corner {
    position: absolute;

    width: 30px;
    height: 30px;

    border-color: white;

    border-style: solid;

    z-index: 2;
}

.corner.tl {
    top: 28px;
    left: 28px;

    border-width: 3px 0 0 3px;
}

.corner.tr {
    top: 28px;
    right: 28px;

    border-width: 3px 3px 0 0;
}

.corner.bl {
    bottom: 28px;
    left: 28px;

    border-width: 0 0 3px 3px;
}

.corner.br {
    bottom: 28px;
    right: 28px;

    border-width: 0 3px 3px 0;
}

/* ---------------- QR ---------------- */

.qr-session {
    display: none;
}

.qr-card {
    max-width: 650px;

    margin: 20px auto;

    text-align: center;
}

.fake-qr {
    width: 280px;
    height: 280px;

    margin: 25px auto;

    padding: 18px;

    background: white;

    border-radius: 20px;

    box-shadow:
        0 20px 45px rgba(13,45,91,.16);

    display: grid;

    grid-template-columns:
        repeat(15, 1fr);

    gap: 2px;
}

.qr-cell {
    background: #111;
}

.qr-cell.white {
    background: white;
}

.live-badge {
    display: inline-flex;

    align-items: center;

    gap: 7px;

    padding: 7px 11px;

    border-radius: 999px;

    color: #b52f2f;

    background:
        rgba(215,68,68,.10);

    font-size: 11px;

    font-weight: 900;

    text-transform: uppercase;
}

.live-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #df3d3d;

    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(.55);
        opacity: .5;
    }
}

/* ---------------- TABLE ---------------- */

.table-wrap {
    overflow-x: auto;

    border-radius: 16px;
}

table {
    width: 100%;

    border-collapse: collapse;

    min-width: 600px;
}

th {
    text-align: left;

    padding: 14px;

    background: #f3f6fb;

    color: var(--muted);

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: .7px;
}

td {
    padding: 15px 14px;

    border-top:
        1px solid #edf0f5;

    font-size: 14px;
}

.status {
    display: inline-flex;

    padding: 6px 10px;

    border-radius: 999px;

    font-size: 11px;

    font-weight: 800;
}

.status.present {
    color: var(--green);

    background:
        rgba(19,134,92,.10);
}

.status.absent {
    color: var(--red);

    background:
        rgba(215,68,68,.10);
}

.status.manual {
    color: var(--orange);

    background:
        rgba(210,139,24,.12);
}

/* ---------------- ADMIN ---------------- */

.admin-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 18px;
}

.admin-action {
    padding: 23px;

    border-radius: 19px;

    background: white;

    box-shadow: var(--shadow);

    border: 1px solid #edf1f7;

    transition: .2s;
}

.admin-action:hover {
    transform: translateY(-3px);

    box-shadow: var(--shadow-hover);
}

.admin-icon {
    width: 46px;
    height: 46px;

    border-radius: 14px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--blue-light);

    color: var(--blue);

    margin-bottom: 15px;

    font-size: 20px;
}

.admin-action h3 {
    font-size: 16px;
}

.admin-action p {
    margin-top: 5px;

    color: var(--muted);

    font-size: 13px;
}

/* ---------------- MODAL ---------------- */

.modal {
    position: fixed;

    inset: 0;

    z-index: 999;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(4,18,38,.48);

    backdrop-filter: blur(8px);
}

.modal.active {
    display: flex;
}

.modal-card {
    width: min(500px, 100%);

    padding: 28px;

    border-radius: 24px;

    background: white;

    box-shadow:
        0 35px 80px rgba(0,0,0,.22);

    animation:
        modalIn .25s ease;
}

@keyframes modalIn {
    from {
        transform: translateY(15px) scale(.97);
        opacity: 0;
    }

    to {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
}

/* ---------------- TOAST ---------------- */

.toast {
    position: fixed;

    right: 20px;
    bottom: 20px;

    z-index: 2000;

    max-width: 350px;

    padding: 15px 18px;

    border-radius: 14px;

    color: white;

    background:
        #162033;

    box-shadow:
        0 15px 35px rgba(0,0,0,.2);

    transform:
        translateY(30px);

    opacity: 0;

    pointer-events: none;

    transition: .25s;
}

.toast.show {
    transform:
        translateY(0);

    opacity: 1;
}

/* ---------------- MOBILE ---------------- */

@media(max-width: 900px) {

    .stats-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .content-grid {
        grid-template-columns: 1fr;
    }

    .admin-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }
}

@media(max-width: 600px) {

    .login-card {
        padding: 28px 20px;
    }

    .stats-grid {
        grid-template-columns: 1fr;
    }

    .admin-grid {
        grid-template-columns: 1fr;
    }

    .main {
        padding-top: 22px;
    }

    .card {
        padding: 20px;
        border-radius: 19px;
    }

    .brand-text span {
        display: none;
    }

    .topbar {
        height: 65px;
    }

    .topbar-inner {
        width: calc(100% - 18px);
    }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="toast" class="toast"></div>

<!-- ======================================================
     JAVASCRIPT
     ====================================================== -->

<script>

/* =========================================================
   APP STATE
   ========================================================= */

const app = document.getElementById("app");

let currentRole = "student";

let locationInside = true;

let attendanceStarted = false;

let attendanceSeconds = 300;

let countdownInterval;


/* =========================================================
   LOGIN
   ========================================================= */

function renderLogin() {

    app.innerHTML = `

    <div class="login-screen">

        <div class="login-card">

            <div class="logo-box">
                NDC
            </div>

            <div class="login-title">
                <h1>NDC Attendance</h1>
                <p>Digital Attendance Management System</p>
            </div>

            <div class="role-switch">

                <button
                    class="role-btn active"
                    onclick="setRole('student', this)">
                    Student
                </button>

                <button
                    class="role-btn"
                    onclick="setRole('teacher', this)">
                    Teacher
                </button>

                <button
                    class="role-btn"
                    onclick="setRole('admin', this)">
                    Admin
                </button>

            </div>

            <div class="form-group">

                <label>Email / ID</label>

                <input
                    class="form-input"
                    id="loginEmail"
                    placeholder="Enter your email or ID">

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    class="form-input"
                    type="password"
                    placeholder="Enter password">

            </div>

            <button
                class="primary-btn"
                onclick="login()">

                Sign In

            </button>

            <p style="
                text-align:center;
                margin-top:18px;
                color:#718096;
                font-size:12px;
            ">
                NDC • Secure Digital Campus
            </p>

        </div>

    </div>

    `;

}


/* =========================================================
   ROLE
   ========================================================= */

function setRole(role, button) {

    currentRole = role;

    document
        .querySelectorAll(".role-btn")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

}


/* =========================================================
   LOGIN
   ========================================================= */

function login() {

    showToast("Login successful");

    setTimeout(() => {

        if(currentRole === "student") {
            renderStudent();
        }

        if(currentRole === "teacher") {
            renderTeacher();
        }

        if(currentRole === "admin") {
            renderAdmin();
        }

    }, 350);

}


/* =========================================================
   TOP BAR
   ========================================================= */

function topbar(name, role) {

    return `

    <div class="topbar">

        <div class="topbar-inner">

            <div class="brand">

                <div class="brand-icon">
                    N
                </div>

                <div class="brand-text">

                    <strong>NDC Attendance</strong>

                    <span>
                        Nagarjuna Degree College
                    </span>

                </div>

            </div>

            <div class="user-menu">

                <div style="

function toggleLocation() {

    locationInside = !locationInside;

    const status =
        document.getElementById("zoneStatus");

    const message =
        document.getElementById("zoneMessage");

    const button =
        document.getElementById("scanBtn");

    if(locationInside) {

        status.className =
            "zone-status inside";

        status.innerHTML =
            '<span class="zone-dot"></span> Inside Zone';

        message.textContent =
            "You are inside NDC campus";

        button.disabled = false;

        button.style.opacity = "1";

    } else {

        status.className =
            "zone-status outside";

        status.innerHTML =
            '<span class="zone-dot"></span> Outside Zone';

        message.textContent =
            "You are outside the attendance zone";

        button.disabled = true;

        button.style.opacity = ".45";

    }

}

/* =========================================================
   FAKE QR
   ========================================================= */

function generateQR() {

    const qr =
        document.getElementById("fakeQR");

    if(!qr) return;

    qr.innerHTML = "";

    for(let i = 0; i < 225; i++) {

        const cell =
            document.createElement("div");

        cell.className =
            Math.random() > .52
            ? "qr-cell"
            : "qr-cell white";

        qr.appendChild(cell);

    }

}


/* =========================================================
   COUNTDOWN
   ========================================================= */

function startCountdown() {

    clearInterval(countdownInterval);

    countdownInterval =
        setInterval(() => {

            attendanceSeconds--;

            if(attendanceSeconds <= 0) {

                clearInterval(countdownInterval);

                showToast(
                    "Attendance session expired."
                );

                renderTeacher();

                return;
            }

            const minutes =
                Math.floor(
                    attendanceSeconds / 60
                );

            const seconds =
                attendanceSeconds % 60;

            const timer =
                document.getElementById("timer");

            if(timer) {

                timer.textContent =
                    `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

            }

        }, 1000);

}


/* =========================================================
   END ATTENDANCE
   ========================================================= */

function endAttendance() {

    clearInterval(countdownInterval);

    attendanceStarted = false;

    showToast(
        "Attendance session ended."
    );

    setTimeout(
        renderTeacher,
        600
    );

}

/* =========================================================
   TOAST
   ========================================================= */

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    }, 2600);

}
